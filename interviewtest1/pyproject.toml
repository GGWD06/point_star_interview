[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "email-support-agent"
version = "0.1.0"
description = "Agentic Customer Support Email Processing System"
requires-python = ">=3.11"

dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=1.0.8",
    "langchain-community>=0.3.0",
    "langchain-chroma>=0.1.0",
    # Document loaders
    "pypdf>=4.0.0",
    "unstructured[md]>=0.15.0",
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Vector store
    "chromadb>=0.5.0",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Contact tracking
    "redis>=5.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
