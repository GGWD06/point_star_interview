<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Agent Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out forwards;
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        /* Results Panel */
        .result-item {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tag.blue { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .tag.green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .tag.red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

        .response-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            margin-top: 0.75rem;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .audit-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .audit-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .audit-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.4rem;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: var(--primary);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 2rem;
            color: var(--primary);
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Form -->
        <div class="glass-panel">
            <h2>✉️ Send Test Email</h2>
            
            <div class="form-group">
                <label>Email ID</label>
                <input type="text" id="email_id" value="test_web_001">
            </div>

            <div class="form-group">
                <label>Sender Email</label>
                <input type="text" id="sender" value="user@example.com">
            </div>

            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" value="Refund request">
            </div>

            <div class="form-group">
                <label>Body</label>
                <textarea id="body">I want my money back within 30 days. Your product didn't work as expected.</textarea>
            </div>

            <button onclick="processEmail()">Process with AI Agent</button>
        </div>

        <!-- Results Panel -->
        <div class="glass-panel" id="result-panel">
            <h2>✨ Processing Results</h2>
            <div id="loader" class="loader">
                Processing through Agentic Pipeline... (please wait)
            </div>
            
            <div id="result-content" style="display: none;">
                <div class="result-item">
                    <label>Action & Classification</label>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                        <span class="tag blue" id="tag-action">Human Review</span>
                        <span class="tag green" id="tag-category">Billing (98%)</span>
                    </div>
                    <div class="response-box" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem;" id="res-reasoning">
                        Reasoning will appear here.
                    </div>
                </div>

                <div class="result-item">
                    <label>Draft Response (Generated by AI)</label>
                    <div class="response-box" id="res-draft">
                        Response will appear here.
                    </div>
                </div>

                <div class="result-item">
                    <label>Guardrail Validation</label>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;" id="guardrail-tags">
                        <span class="tag red">Passed: False</span>
                    </div>
                </div>

                <div class="result-item">
                    <label>Audit Log (Agent Steps)</label>
                    <ul class="audit-list" id="res-audit">
                        <li>Step 1...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function processEmail() {
            const btn = document.querySelector('button');
            const loader = document.getElementById('loader');
            const content = document.getElementById('result-content');
            
            // UI State
            btn.disabled = true;
            btn.style.opacity = '0.5';
            content.style.display = 'none';
            loader.style.display = 'block';

            const payload = {
                email_id: document.getElementById('email_id').value,
                sender_email: document.getElementById('sender').value,
                subject: document.getElementById('subject').value,
                body: document.getElementById('body').value
            };

            try {
                // Assuming standard local configuration
                const response = await fetch('http://localhost:8000/api/v1/emails/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': 'change-me-in-production' // Hardcoded based on .env
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Server error");
                }

                const data = await response.json();
                
                // Update UI with Results
                document.getElementById('tag-action').innerText = data.final_action;
                
                // Category Tag
                const catTag = document.getElementById('tag-category');
                catTag.innerText = `${data.classification.category} (${(data.classification.confidence * 100).toFixed(0)}%)`;
                
                // Reasoning
                document.getElementById('res-reasoning').innerText = data.classification.reasoning;

                // Draft Response
                document.getElementById('res-draft').innerText = data.draft_response || "No response generated.";

                // Guardrails
                const guardrailTags = document.getElementById('guardrail-tags');
                if (data.guardrail.passed) {
                    guardrailTags.innerHTML = '<span class="tag green">Guardrail Passed</span>';
                } else {
                    guardrailTags.innerHTML = '<span class="tag red">Guardrail Failed</span>';
                }

                // Audit Log
                const auditList = document.getElementById('res-audit');
                auditList.innerHTML = '';
                data.audit_log.forEach(log => {
                    const li = document.createElement('li');
                    li.innerText = log;
                    auditList.appendChild(li);
                });

                // Show results
                loader.style.display = 'none';
                content.style.display = 'block';

            } catch (error) {
                alert("Pipeline Error: " + error.message);
                loader.style.display = 'none';
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
